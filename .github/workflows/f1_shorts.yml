name: F1 Shorts Autonomous Pipeline

on:
  schedule:
    # 10:47 AM IST (UTC+5:30)
    - cron: '17 5 * * *'
    # 7:12 PM IST (UTC+5:30)
    - cron: '42 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F1 Shorts Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          PRIVACY_STATUS: public
          YOUTUBE_PRIVACY_STATUS: public
          ANTIGRAVITY_MODEL: gemini-4-hydrogen
        run: |
          python main.py

      - name: Commit and push updated history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No changes to history.json to commit."
          else
            git commit -m "chore: update F1 Shorts history.json [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
