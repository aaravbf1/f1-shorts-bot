name: F1 Shorts Autonomous Pipeline

on:
  schedule:
    # 10:47 AM IST (UTC+5:30)
    - cron: '17 5 * * *'
    # 7:12 PM IST (UTC+5:30)
    - cron: '42 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run F1 Shorts Engine
        env:
          PYTHONUNBUFFERED: "1"
          HEADLESS: "true"
          USE_DIRECT_GEMINI_API: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          PRIVACY_STATUS: public
          YOUTUBE_PRIVACY_STATUS: public
          TTS_RATE: "-10%"
          INTER_BEAT_GAP_SEC: "0.35"
          LLM_CALL_TIMEOUT_SEC: "30"
          HTTP_TIMEOUT_SEC: "15"
        run: |
          python -u main.py

      - name: Commit and push updated history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet history.json; then
            echo "No changes to history.json to commit."
          else
            git pull --rebase --autostash origin main
            git add history.json
            if git diff --cached --quiet; then
              echo "No staged changes to history.json after rebase."
            else
              git commit -m "chore: update F1 Shorts history.json [skip ci]"
              git push origin HEAD:main
            fi
          fi
